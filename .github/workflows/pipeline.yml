# El pipeline documental, corriendo solo.
#
# ⛔ SECO POR DEFECTO, Y NO ES PRUDENCIA DECORATIVA. `SOLICITUDES` es la hoja de un pipeline en
#    marcha y NO TIENE DESHACER: si una pasada escribe mal cuarenta filas, se arreglan a mano una
#    por una. Una tarea programada que escribe en producción sin que nadie mire es exactamente lo
#    que no se debe montar, así que:
#
#      · la pasada automática va SIN `--aplicar`: dice qué haría y qué celdas escribiría;
#      · aplicar es una decisión de una persona, con `workflow_dispatch` y el interruptor puesto.
#
# ⚠️ Y `--limite` está ahí para que la primera pasada de verdad toque TRES expedientes, se miren,
#    y sólo después se suelte entera. Sin tope, un error de criterio se multiplica por toda la cola.
#
# ⬜ PENDIENTE DE DANIEL — el `schedule` está SIN poner a propósito.
#    Hace falta antes: `GDRIVE_SA_KEY`, `NOTION_TOKEN` y `NOTION_DATA_SOURCE_ID`.
#    Sin ellos la tarea fallaría en cada vuelta, y una acción que sale roja cada hora se acaba
#    ignorando — con lo que el día que el rojo signifique algo, tampoco lo mirará nadie.
#    Cuando estén, se añade aquí:
#
#      schedule:
#        - cron: "*/30 * * * *"
#
name: pipeline documental

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Escribir de verdad en la hoja (sin esto, pasada seca)"
        type: boolean
        default: false
      limite:
        description: "Máximo de expedientes a tocar (vacío = todos)"
        type: string
        default: "3"
      revisar:
        description: "Sólo repasar los datos y listar lo que no cuadra"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pasada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bancos
        # ⛔ Antes de tocar nada, el árbol entero. Son puros y offline: cuestan segundos, y correr
        #    el pipeline con un banco rojo es escribir en producción con algo que ya sabemos roto.
        run: |
          set -e
          n=0
          for b in scripts/test_*.py; do
            PYTHONDONTWRITEBYTECODE=1 python -B "$b"
            n=$((n+1))
          done
          echo "$n bancos verdes"
          test "$n" -gt 0

      # ⚠️ Las librerías se instalan AQUÍ y no antes de los bancos, a propósito: los bancos
      #    corren sin ellas — doblan lo que haga falta — y esa es su garantía de que no
      #    hablan con el mundo. Es la misma línea que ya usan los otros workflows del repo.
      - run: pip install google-api-python-client google-auth

      - name: Pasada
        env:
          # ⛔ `GDRIVE_SA_KEY`, no `GOOGLE_CREDENTIALS`: es el nombre que YA usa este repo
          #    (`check_pipeline_status.py`). Inventar otro habría partido en dos la
          #    configuración existente y el fallo sería «falta la credencial» con el secreto
          #    puesto — de los que cuestan una hora.
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          # ⛔ `DOMINIO_EQUIPO` no es un secreto, pero SIN ELLA la publicación se para en
          #    seco: `permiso_dominio` se niega a compartir con "", que no comparte con
          #    nadie. Faltaba, y el fallo habría sido «falta la variable» con todos los
          #    secretos puestos. Lo ata un caso de `test_cli.py` que descubre por `ast`
          #    lo que el código lee y lo busca en este fichero.
          #    ⛔⛔ Y **sin valor por defecto a propósito**. Compartir un documento con un
          #       dominio es una acción hacia fuera, y el dominio del equipo es una
          #       decisión de Daniel, no una que se deduzca de los correos que se ven en
          #       la hoja. Sin la variable, la pasada se para diciendo cuál falta — que es
          #       barato— en vez de compartir con un dominio que eligió un script.
          DOMINIO_EQUIPO: ${{ vars.DOMINIO_EQUIPO }}
        run: |
          set -e
          ARGS=""
          if [ "${{ inputs.revisar }}" = "true" ]; then
            ARGS="--revisar"
          else
            if [ "${{ inputs.aplicar }}" = "true" ]; then ARGS="--aplicar"; fi
            if [ -n "${{ inputs.limite }}" ]; then ARGS="$ARGS --limite ${{ inputs.limite }}"; fi
          fi
          echo "argumentos: ${ARGS:-(pasada seca, sin tope)}"
          python scripts/cli.py $ARGS | tee salida.txt

      - name: Informe a la vista
        if: always()
        # El informe va al resumen de la ejecución: lo que hay que leer no debería estar enterrado
        # en un desplegable de registros que nadie abre.
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat salida.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(sin salida)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
